<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>잘못한 점 찾기</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <button id="sceneButton" class="scene-button" type="button" aria-label="잘못한 점 찾기">
        <img
          id="scene"
          src="assets/scene-variety-apology.png"
          alt="밝은 예능 세트처럼 보이는 평범한 거실 장면"
        >
      </button>

      <section id="printArea" class="print-area" aria-hidden="true">
        <p id="docTime" class="doc-time">--:-- 자동 생성</p>
        <h1>반성문</h1>
        <p id="apologyText"></p>
        <p class="command">고개 숙여 사과드립니다.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
